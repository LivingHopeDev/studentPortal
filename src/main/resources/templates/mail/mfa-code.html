<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; color: #333; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #059669; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 30px; background: #f9fafb; text-align: center; }
        .code { font-size: 36px; font-weight: bold; letter-spacing: 8px; color: #059669; background: #e5e7eb; padding: 20px; border-radius: 8px; margin: 20px 0; display: inline-block; }
        .footer { text-align: center; padding: 20px; font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MFA Verification Code</h1>
        </div>
        <div class="content">
            <p>Dear <strong th:text="${name}">User</strong>,</p>
            <p>Use the following code to complete your authentication:</p>
            <div class="code" th:text="${code}">123456</div>
            <p>This code will expire in 5 minutes.</p>
            <p>If you did not request this, please ignore this email.</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 Student Management Portal. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
